<!DOCTYPE html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#09246B" />
    <meta name="description" content="Tamilnadu Mobile Sales and Service Association (TMSSA) - Connecting all 38 districts, administrators, and members across Tamil Nadu under one centralized digital platform." />
    <title>தமிழ்நாடு மொபைல் சேல்ஸ் அண்டு சர்வீஸ் அசோசியேஷன் | Tamilnadu Mobile Sales and Service Association</title>

    <!-- Favicon & Site Logo for Browsers & Google Search -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/jpeg" href="/logo.jpg" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.jpg" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tnmssa.com/" />
    <meta property="og:site_name" content="Tamilnadu Mobile Sales and Service Association" />
    <meta property="og:title" content="தமிழ்நாடு மொபைல் சேல்ஸ் அண்டு சர்வீஸ் அசோசியேஷன் | TMSSA" />
    <meta property="og:description" content="Tamilnadu Mobile Sales and Service Association (TMSSA) - Connecting all 38 districts, administrators, and members across Tamil Nadu." />
    <meta property="og:image" content="https://www.tnmssa.com/logo.jpg" />

    <!-- Structured Data for Google Search Logo & Site Name -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tamilnadu Mobile Sales and Service Association",
        "alternateName": "TMSSA",
        "url": "https://www.tnmssa.com",
        "logo": "https://www.tnmssa.com/logo.jpg"
      }
    </script>

    <!-- DNS Prefetch & Preconnect for Fonts and CDN Media -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- Non-render-blocking Google Fonts with fallback -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
